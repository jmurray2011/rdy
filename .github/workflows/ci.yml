name: validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: true
      - name: Install native artifact fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm
          command -v bsdtar
          command -v rpmbuild
          command -v dpkg-deb
      - name: Install pinned validation tools
        run: |
          go install mvdan.cc/gofumpt@v0.12.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: sh scripts/validate.sh
      - name: Static build
        run: CGO_ENABLED=0 go build -trimpath -ldflags '-X main.buildVersion=ci' -o build/rdy ./cmd/rdy

